name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright Chromium does not support 26.04 yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Chromium for the snapshot tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests (offline, recorded fixtures)
        run: pytest -q
